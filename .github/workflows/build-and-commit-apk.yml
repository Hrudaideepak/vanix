name: 🛠️ Build & Commit APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    name: Build & Commit APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Java ────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 3. Set up Flutter ─────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      # ── 4. Get dependencies ───────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 5. Build Debug APK ────────────────────────────────────────────
      - name: Build debug APK
        run: flutter build apk --debug

      # ── 6. Install Git LFS & Commit ───────────────────────────────────
      - name: Commit and Push APK
        run: |
          git lfs install
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-debug.apk apk/vanix.apk
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git lfs track "apk/vanix.apk"
          git add .gitattributes
          git add apk/vanix.apk
          
          git commit -m "build: compile and update apk/vanix.apk [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}
