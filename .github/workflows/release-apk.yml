name: 🚀 VANIX — Build & Release APK

on:
  push:
    branches:
      - main
      - feature/mobile-app-v2
    paths:
      - 'mobile_app/**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Custom release notes (optional)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Java ────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 3. Set up Flutter ─────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      # ── 4. Get dependencies ───────────────────────────────────────────
      - name: Install Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      # ── 5. Build Debug APK ────────────────────────────────────────────
      - name: Build debug APK
        working-directory: mobile_app
        run: flutter build apk --debug

      # ── 6. Compute release version ────────────────────────────────────
      - name: Compute release version
        id: version
        run: |
          # Use date + short SHA for a unique version tag
          DATE=$(date +'%Y.%m.%d')
          SHA=$(git rev-parse --short HEAD)
          BRANCH="${GITHUB_REF_NAME//\//-}"
          TAG="v${DATE}-${SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

      # ── 7. Rename APK with version ────────────────────────────────────
      - name: Rename APK
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-debug.apk \
             vanix-${{ steps.version.outputs.tag }}-debug.apk

      # ── 8. Generate release notes ─────────────────────────────────────
      - name: Generate release notes
        id: notes
        run: |
          CUSTOM="${{ github.event.inputs.release_notes }}"
          COMMITS=$(git log --oneline -10 --pretty=format:"- %s")
          
          cat > release_notes.md << EOF
          ## 🌌 VANIX OTT Platform — ${{ steps.version.outputs.tag }}
          
          **Branch:** \`${{ steps.version.outputs.branch }}\`  
          **Build:** Debug APK (Android)  
          **Flutter:** 3.44.1 Stable  
          
          ${CUSTOM:+### 📝 Notes
          ${CUSTOM}}
          
          ### 🎬 Recent Changes
          ${COMMITS}
          
          ---
          ### 📱 Install Instructions
          1. Download \`vanix-${{ steps.version.outputs.tag }}-debug.apk\`
          2. Transfer to your Android phone (USB / cloud)
          3. On Android: **Settings → Security → Allow Unknown Sources**
          4. Tap the APK to install
          
          > ⚠️ This is a **debug build** for testing. A production-signed release will be published separately.
          EOF

      # ── 9. Create GitHub Release & upload APK ─────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "VANIX ${{ steps.version.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: true
          files: vanix-${{ steps.version.outputs.tag }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
