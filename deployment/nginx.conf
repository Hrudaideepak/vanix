user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream backend server container reference
    upstream backend_server {
        server vanix-backend:5000;
    }

    # Upstream frontend admin container reference
    upstream admin_server {
        server vanix-admin:80;
    }

    server {
        listen 80;
        server_name vanix-ott.com www.vanix-ott.com;

        # Redirect all HTTP requests to HTTPS (uncomment in production with SSL)
        # return 301 https://$host$request_uri;

        # Serve React Web Admin Panel
        location / {
            proxy_pass http://admin_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse Proxy REST API Requests to Node.js Backend
        location /api {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API Upload limit configuration (increased to allow large video file uploads)
            client_max_body_size 10G;
        }
    }
}
