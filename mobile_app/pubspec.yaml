name: vanix
description: VANIX - Unlimited Entertainment. One Universe. Premium OTT Streaming Platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  chewie: ^1.7.5
  video_player: ^2.8.2
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  intl: ^0.19.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.1
  # firebase_core: ^2.24.2      # Re-enable after adding google-services.json
  # firebase_messaging: ^14.7.10 # Re-enable after adding google-services.json

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
